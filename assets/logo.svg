<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Un-Default</title>
  <desc id="desc">Teal seal with a default path branching away in coral</desc>
  <path
    d="M28 48 C28 28 48 16 128 16 C208 16 228 28 228 48 L228 228 L28 228 Z"
    fill="#1A524A"
  />
  <rect x="28" y="196" width="200" height="32" fill="#C45C4A" />
  <!-- default path (straight) -->
  <path
    d="M88 168 L88 72"
    fill="none"
    stroke="#F6F1E8"
    stroke-width="18"
    stroke-linecap="round"
  />
  <!-- branch leaving the default -->
  <path
    d="M88 120 C88 120 88 120 152 88 C176 76 196 70 210 66"
    fill="none"
    stroke="#C45C4A"
    stroke-width="18"
    stroke-linecap="round"
  />
  <!-- branch tip -->
  <circle cx="210" cy="66" r="14" fill="#F6F1E8" />
</svg>
