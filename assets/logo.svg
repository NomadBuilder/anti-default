<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Un-Default</title>
  <desc id="desc">Soft square mark: open ring leaving a default notch</desc>
  <!-- soft square field -->
  <rect width="256" height="256" rx="56" fill="#1A524A" />
  <!-- default notch (closed system) -->
  <rect x="48" y="112" width="52" height="32" rx="16" fill="#F6F1E8" fill-opacity="0.35" />
  <!-- open ring (leaving the default) -->
  <circle
    cx="148"
    cy="128"
    r="58"
    fill="none"
    stroke="#F6F1E8"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="280 85"
    stroke-dashoffset="40"
    transform="rotate(-35 148 128)"
  />
  <!-- coral accent tip where the ring opens -->
  <circle cx="198" cy="78" r="18" fill="#C45C4A" />
</svg>
